[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ayaz-decryptor"
version = "0.1.0"
description = "Восстановление файлов совместимого варианта LockBit по известному потоку метаданных"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: C",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Topic :: Security :: Cryptography",
]

[project.scripts]
ayaz-decryptor = "ayaz_decryptor.__main__:main"

[tool.setuptools]
packages = ["ayaz_decryptor"]
include-package-data = false

[tool.setuptools.package-data]
ayaz_decryptor = ["_native.c"]
